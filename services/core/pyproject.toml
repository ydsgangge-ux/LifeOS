[project]
name = "lifeos-core"
version = "0.2.0"
description = "LifeOS 人生数字化系统 —— 本地优先的核心引擎"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlcipher3>=0.5",
    "argon2-cffi>=23.1",
    "cryptography>=42",
    "keyring>=25",
    "PyYAML>=6",
    "jinja2>=3.1",
    "python-ulid>=2",
    "httpx>=0.27",
    "APScheduler>=3.10",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "hypothesis>=6.100",
    "schemathesis>=4.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "import-linter>=2.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
lifeos = ["db/migrations/*.sql", "schemas/**/*.yaml"]

[tool.setuptools.packages.find]
include = ["lifeos*"]

# ---------------------------------------------------------------------------
# 质量工具
# ---------------------------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["."]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM"]

# FastAPI 的依赖注入与参数声明本来就是「在默认值里调用函数」（B008 的官方例外）
[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Header",
    "fastapi.Path",
    "fastapi.Body",
    "fastapi.File",
    "fastapi.Form",
]

[tool.mypy]
python_version = "3.12"
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = false
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

# 只有 llm/ 目录允许联网（ADR/设计原则 2，单一出口）
[tool.importlinter]
root_packages = ["lifeos"]
# 契约里禁止的是外部包（httpx 等），必须显式允许分析外部依赖
include_external_packages = true

[[tool.importlinter.contracts]]
name = "只有 llm 可以联网"
type = "forbidden"
source_modules = [
    "lifeos.api",
    "lifeos.domain",
    "lifeos.analytics",
    "lifeos.research",
    "lifeos.reporting",
    "lifeos.privacy",
    "lifeos.security",
    "lifeos.db",
    "lifeos.forms",
    "lifeos.backup",
    "lifeos.selfcheck",
]
forbidden_modules = [
    "httpx",
    "requests",
    "urllib3",
    "aiohttp",
    "urllib",
]
# 第 3.2 节的规则是「只有 llm/ 目录允许 import httpx」——针对直接 import。
# 允许间接依赖，是为了放行 reporting → llm（llm 是被许可的联网抽象层，且已由
# 第 3.2 节列为 reporting 的出网方式）。若这里关掉，reporting 一旦 import llm
# 就会被间接链（reporting → llm → httpx）判为违规，反而与设计意图相反。
allow_indirect_imports = true
