# LifeOS shared catalog (NFR-08: default zh-CN; every user-facing string goes through an i18n key).
#
# Conventions — the key set must match zh-CN.yaml exactly (guarded by tests/test_locale.py):
#   - Frontend and backend share this one file (Vite inlines it; lifeos.i18n reads it).
#   - Keys are "flat dotted": the whole string is one key, dots do not mean nesting
#     (i18next needs keySeparator / nsSeparator off).
#   - Values are plain strings; placeholders use single braces {name}.
#   - Data/schema strings (form titles, metric descriptions, dictionary labels) are written
#     as `i18n:<key>` references and resolved by the renderer; the target keys live here.

