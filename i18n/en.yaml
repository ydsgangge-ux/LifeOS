# -- Self-awareness check (16, P1.5) ----------------------------------------
# Hypotheses and alternative explanations default to local templates; only with api_extended
# and after you confirm each one do they go to an LLM for polishing. Values come from real
# detector output, and the wording avoids appraisal or speculative terms (16.7 / 16.8).
selfcheck.hyp.start_vs_finish: "In the past {window_days} days you started {plans_started} plans: {plans_done} finished, {plans_dropped} dropped or replaced, and {plans_active} still running."
selfcheck.hyp.time_vs_values: "Over the last 90 days you put the most time into {top_domain_label} ({top_minutes} minutes); {claim_domain_label}, which you said matters more to you, got {claim_minutes} minutes."
selfcheck.hyp.ability_vs_trial: "You recorded {attempts} attempts on this, {total_minutes} minutes in total; of your {level_assessments} skill assessments, the latest was {level_last}."
selfcheck.hyp.forecast_vs_history: "There are {reference_n} comparable plans in the same area: {reference_done} finished and {reference_dropped} dropped."
selfcheck.hyp.change_claim: "The mean over the last {window_days} days is {recent_mean}, and the {window_days} days before that were {prev_mean}; the difference is {diff}."

selfcheck.alt.start_vs_finish.1: "You start a lot of plans, but each cycle is naturally long and the window hasn't finished yet, so completions lag behind."
selfcheck.alt.start_vs_finish.2: "You did concentrate your effort on a few key plans; the rest were one-off tries, which is not really giving up halfway."
selfcheck.alt.time_vs_values.1: "Your schedule was crowded by ad-hoc matters during this stretch, so the time ranking may not reflect your real priorities."
selfcheck.alt.time_vs_values.2: "{claim_domain_label}, which you value, needs steady small steps rather than total hours — minutes understate its weight."
selfcheck.alt.ability_vs_trial.1: "There aren't many attempts yet, so no stable trend is visible; the curve may just be at the starting stage."
selfcheck.alt.ability_vs_trial.2: "What you care about shows in quality rather than count — one session can be worth many, so the sample size understates your effort."
selfcheck.alt.forecast_vs_history.1: "The reference group mixes plans of very different length or scale, so the base rate isn't comparable."
selfcheck.alt.forecast_vs_history.2: "This goal differs from the past (time, resources and experience have all changed), so the historical base rate may not apply."
selfcheck.alt.change_claim.1: "Metrics naturally rise and fall; this difference may still be within normal fluctuation."
selfcheck.alt.change_claim.2: "The change is real — it just showed up elsewhere first and hasn't reached this metric yet."

selfcheck.falsifier.start_vs_finish: "If most plans started in the next {window_days} days finish, this judgment doesn't hold."
selfcheck.falsifier.time_vs_values: "If your records show {claim_domain_label} really is first in time invested, this judgment doesn't hold."
selfcheck.falsifier.ability_vs_trial: "If later assessments show your level rising steadily, or attempts clearly increasing, this judgment doesn't hold."
selfcheck.falsifier.forecast_vs_history: "If a clearly higher share of these plans finish than the reference base rate, this judgment doesn't hold."
selfcheck.falsifier.change_claim: "If the metric drifts back near its earlier mean over the coming stretch, this judgment doesn't hold."

