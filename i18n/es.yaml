# Catálogo compartido de LifeOS (NFR-08: idioma por defecto zh-CN; todos los textos pasan por claves i18n).
#
# Convenciones:
#   - El frontend y el backend comparten este único archivo (Vite lo integra en el build; el backend lo lee
#     con lifeos.i18n), igual que schemas/dictionaries, para evitar que los textos se desincronicen entre ambos.
#   - Las claves son «planas con puntos»: toda la cadena es una sola clave, los puntos no indican jerarquía
#     (i18next debe desactivar keySeparator).
#   - Los valores son cadenas simples; los marcadores de posición usan llaves simples {name} (el backend usa
#     str.format y el frontend i18next con los mismos prefijos y sufijos).
#   - Los textos de datos/Schema (títulos de formularios, descripciones de métricas, etc.) se escriben
#     como referencias `i18n:<key>` y los resuelve la capa de renderizado; aquí vive la clave de destino.
#
# Nuevo idioma: copia este archivo como <locale>.yaml (p. ej. es.yaml) y traduce los valores; el código no cambia.

