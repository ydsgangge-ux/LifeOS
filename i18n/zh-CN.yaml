# LifeOS 共享词表（NFR-08：默认 zh-CN，所有文案走 i18n key）。
#
# 约定：
#   - 前后端共用这一份文件（前端由 Vite 打进产物，后端由 lifeos.i18n 读取），
#     与 schemas/dictionaries 的做法一致，避免两端文案漂移。
#   - 键为「平键点号」：整串就是一个键，点号不表示层级（i18next 需关掉 keySeparator）。
#   - 值为纯字符串；带参数的占位符统一用 {name} 单花括号（后端 str.format、
#     前端 i18next 用相同的前后缀）。
#   - 数据/Schema 里的文案（表单标题、指标说明等）写成 `i18n:<key>` 引用，
#     由渲染层解析；这里存的就是被引用的目标键。
#
# 新增语言：复制本文件为 <locale>.yaml（如 en-US.yaml）并翻译值即可，代码不用改。

