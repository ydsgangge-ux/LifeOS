# -- 自己認知チェック（第16章、P1.5）---------------------------------------
# 仮説と代替説明は既定でローカルのテンプレートから生成し、api_extended かつ
# あなたが1件ずつ確認したときだけ LLM に磨きをかける。値は検出器が算出した実際の値で、
# 文言には評価的・忖度的な語を使わない（第16.7 / 16.8節）。
selfcheck.hyp.start_vs_finish: "過去 {window_days} 日の間に、あなたは {plans_started} 件の計画を始め、うち {plans_done} 件が完了、{plans_dropped} 件が断念または差し替え、{plans_active} 件がまだ進行中です。"
selfcheck.hyp.time_vs_values: "直近90日で最も時間をかけたのは{top_domain_label}（{top_minutes} 分）でした。あなたがより重視していると述べた{claim_domain_label}には {claim_minutes} 分でした。"
selfcheck.hyp.ability_vs_trial: "あなたはこれに {attempts} 回の挑戦を記録し、累計 {total_minutes} 分を投じました。{level_assessments} 回のレベル評価のうち、直近は {level_last} でした。"
selfcheck.hyp.forecast_vs_history: "同じ領域に比較可能な計画が {reference_n} 件あり、うち {reference_done} 件が完了、{reference_dropped} 件が断念でした。"
selfcheck.hyp.change_claim: "直近 {window_days} 日の平均は {recent_mean}、その前の {window_days} 日は {prev_mean}、差は {diff} です。"

selfcheck.alt.start_vs_finish.1: "計画の数は多いものの、1サイクルがもともと長く、期間がまだ終わっていないため完了が遅れているだけかもしれません。"
selfcheck.alt.start_vs_finish.2: "あなたは確かに力を少数の重要な計画に集中させており、残りは一度きりの試みで、途中で投げ出したとは言えません。"
selfcheck.alt.time_vs_values.1: "この期間は予定外の用事に日程を圧迫されていたため、時間の順位が本当の優先順位を反映していない可能性があります。"
selfcheck.alt.time_vs_values.2: "あなたが重視する{claim_domain_label}は合計時間よりも継続的な小さな積み重ねが必要で、分の数はその重みを過小評価しています。"
selfcheck.alt.ability_vs_trial.1: "挑戦の回数はまだ少なく、安定した傾向は見えません。今の曲線は始まったばかりの段階かもしれません。"
selfcheck.alt.ability_vs_trial.2: "あなたが気にする上達は回数より質に表れ、1回の練習が何回分にもなります。サンプル数はあなたの投入を過小評価しています。"
selfcheck.alt.forecast_vs_history.1: "参考にした集まりには期間や規模が大きく異なる計画が混じっており、基礎比率が比較に適しません。"
selfcheck.alt.forecast_vs_history.2: "今回の目標は過去とは異なり（時間・資源・経験が変わった）、過去の基礎比率は当てはまらないかもしれません。"
selfcheck.alt.change_claim.1: "指標はもともと上下するもので、この差はまだ正常な変動の範囲内かもしれません。"
selfcheck.alt.change_claim.2: "変化は本物ですが、まず別のところに現れ、まだこの指標には反映されていないだけです。"

selfcheck.falsifier.start_vs_finish: "これから {window_days} 日の間に新しく始めた計画の多くが完了すれば、この判断は成り立ちません。"
selfcheck.falsifier.time_vs_values: "記録で{claim_domain_label}への投入時間が実際に首位だと示されれば、この判断は成り立ちません。"
selfcheck.falsifier.ability_vs_trial: "その後の評価でレベルが上昇し続ける、または挑戦回数が明らかに増えれば、この判断は成り立ちません。"
selfcheck.falsifier.forecast_vs_history: "この計画群で完了した実際の割合が参考集まりの基礎比率より明らかに高ければ、この判断は成り立ちません。"
selfcheck.falsifier.change_claim: "これからの期間で指標が再び元の平均付近に戻れば、この判断は成り立ちません。"

