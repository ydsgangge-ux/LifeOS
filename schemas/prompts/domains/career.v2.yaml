# 工作镜头 v2：在 v1 的投入/产出读数之上，允许读本期条目的标题、备注与时间。
#
# 边界不变：影响力是主观评分，样本不足时只报次数，不评价工作选择。
domain: career
question: 工作上的投入，落在有影响的事上了吗？
look_at:
  - 本期条目的标题、备注与时间：先看具体在做什么、做到哪一步
  - 投入一侧：时长与活跃天数
  - 产出一侧：影响力均值与机会数
  - 影响力评分的样本量是否支撑结论
worth_saying:
  - 你写到的事情，是否集中在少数几件有产出的工作上
  - 投入不少，但机会数或影响力没有跟着动
  - 出现了新机会，但这期没有任何推进迹象
not_worth_saying:
  - 样本很少时影响力小数位的差别
  - 单周的时长波动
traps:
  - 影响力是主观评分，样本不足时只报次数、不下结论
  - 不推断职场因果，不评价工作选择对不对
  - 单位、客户和同事用「一个项目」「客户那边」「同事」这类说法，不写具体名称
needs_basics: true
min_data:
  note: 本期至少一天有工作记录就写；只有一天时只描述发生了什么，不谈投入产出关系
  coverage_days: 1
good_example: |
  你写到这周主要在推进一个项目，前几天都在改方案，后面才留出时间做汇报；工作投入 [[fact:domain_facts.career.minutes_total]]，分布在 [[fact:domain_facts.career.active_days]] 天，出现 [[fact:domain_facts.career.opportunity_count]] 个新机会。投入不算少，但影响力评分样本太少，这期先不下结论，只记下机会有没有跟进。
