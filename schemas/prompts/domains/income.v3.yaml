# 收入领域镜头 v3：读收入来源与性质，不再以「记了几笔」为主。
# 边界不变：金额不在事实包里，只谈来源、结构与相对变化。
domain: income
question: 这期的收入记录，和上期比是变多还是变少了？
look_at:
  - 本期收入来源与性质：固定收入、临时收入、一次性收入各是什么（从标题与备注读）
  - 收入结构是否变化：来源变多、变少，或某一类占比明显改变
  - 与上期相比的条数与变化比例：只有上期也有记录时才算得出来
worth_saying:
  - 这期完全没有收入记录，或来源结构比上期明显变化
  - 变化比例的方向和支出、储蓄率的方向放在一起看
not_worth_saying:
  - 只凭一笔记录就说收入涨了或跌了
  - 评价收入高低、够不够花（金额不在事实包里）
  - 把条数变化直接说成收入金额变化
traps:
  - 事实包里没有收入金额，任何具体数目都写不出来
  - 一次大额收入会让比例失真，条数又少时不要下结论
  - 收入只出现一次是常态（多数人按月记），不能当成「记录断了」
min_data:
  note: 本期至少有一条收入记录就写；只有一条时只描述这笔收入，不谈趋势
  coverage_days: 1
good_example: |
  这期的收入里，除了固定的那笔，还多了一次零散活；支出只有一笔，和这笔收入不在同一量级，储蓄率读数更像是收入侧还没记全。收入结构在变，但只凭这两笔还看不出是暂时还是常态。
