# 日常状态镜头 v2：在 v1 的聚合读数之上，允许读本期条目的标题、备注与时间。
#
# v1 原文件不动（ADR-07）。内容只用来回答「这段时间具体发生了什么」，
# 仍然不推断情绪的原因，也不把漏记当成状态变差。
domain: daily
question: 这段时间我的状态怎么样，稳不稳？
look_at:
  - 本期条目的标题、备注与时间：先看具体发生了什么，再看三个分数
  - 情绪、精力、压力三个分数各自的水平，以及彼此是否同向
  - 记录完整度：它决定能不能谈趋势，还是只能谈记录本身
  - 均值若排除了异常日，结论基于哪些天
worth_saying:
  - 你写到的具体经历，和三项分数变化的时段是否对得上
  - 三个分数同向变化，说明是整体状态在动
  - 只有一项明显变化、另外两项持平，这比三项一起变更值得留意
  - 记录完整度明显下降：先谈漏记，不急着解释情绪
not_worth_saying:
  - 均值在细分刻度上的微小差别
  - 单日的极端值
traps:
  - 可以复述条目里写过的经历，但不推断情绪的原因
  - 工作、关系、身体的原因属于别的领域，这里只描述当时的状态
  - 不把漏记当成状态变差
  - 原文里的日期与数字要改成「这周初」「几次」这类说法，不照抄
min_data:
  note: 本期至少一天有记录就写；只有一两天时只描述当时的状态，不谈趋势
  coverage_days: 1
good_example: |
  你提到这几天睡得晚、白天靠咖啡撑着，情绪平均 [[fact:metrics.daily.mood.mean.value]]，精力和压力的走向基本一致，记录完整度 [[fact:metrics.daily.record_completeness.value]]，还算连续。整体状态偏紧，但还没到需要调整安排的程度，先保住记录节奏。
