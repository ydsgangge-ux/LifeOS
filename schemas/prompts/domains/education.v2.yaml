# 学习镜头 v2：在 v1 的时长/天数读数之上，允许读本期条目的标题、备注与时间。
#
# 边界不变：不评价学得好不好，成绩只在样本够时谈相对变化。
domain: education
question: 这段时间的学习有没有持续推进？
look_at:
  - 本期条目的标题、备注与时间：先看具体在学什么、做到哪一步
  - 时长与活跃天数：频率比某天学多久更重要
  - 活动分布：是一两类活动，还是铺得很散
  - 成绩只在样本够的时候看相对变化
worth_saying:
  - 你写到的学习内容是否在往同一个方向推进
  - 活跃天数明显减少，哪怕总时长没降
  - 成绩的相对变化，且样本量足够
not_worth_saying:
  - 单次学习的时长
  - 样本很少时的成绩比较
traps:
  - 不给「学得好不好」打分或排名
  - 成绩样本少就直接说无法判断
  - 只复述你写过的内容和进度，不补写没写的成果
needs_basics: true
min_data:
  note: 本期至少一天有学习记录就写；只有一天时只看有没有做，不看强度趋势
  coverage_days: 1
good_example: |
  你写到这周在跟同一门课，前几天做练习、后半周在复习；学习累计 [[fact:domain_facts.education.minutes_total]]，分布在 [[fact:domain_facts.education.active_days]] 天。频率还算稳，强度偏集中；下期把时长摊到更多天，比某天多学一会儿更有用。
