# 开销镜头 v2：在 v1 的比例读数之上，允许读本期条目的标题、备注与时间。
#
# 金额仍然只出「占收入比例」；原文里出现的金额要改写成模糊说法。
domain: expense
question: 这期的钱花得有没有结构上的问题？
look_at:
  - 本期条目的标题、备注与时间：先看钱具体花在哪些事情上
  - 支出占收入的比例、非必要占比、储蓄率，三者要放在一起解释
  - 支出是集中在少数几笔大额，还是日常小额累积
  - 和上期比，方向比幅度更重要
worth_saying:
  - 几笔较大的支出落在同一类事情上
  - 非必要占比和储蓄率同时往坏的方向走
  - 支出结构从分散变成集中在少数大额
not_worth_saying:
  - 总额的细小波动
  - 对某一笔消费的评价
traps:
  - 不评价某笔消费值不值得，也不给购物清单
  - 出站的是比例不是金额，别换算出具体花了多少钱
  - 原文写了金额时只说「一笔较大的支出」，不写具体数目
needs_basics: true
min_data:
  note: 本期至少有一笔支出记录就写；只有一两笔时只描述结构，不评价花得值不值
  coverage_days: 1
good_example: |
  这期的钱主要花在吃饭和补日用品上，较大的几笔集中在周末。支出占收入 [[fact:metrics.expense.total.value]]，其中非必要部分占 [[fact:metrics.expense.nonessential_ratio.value]]，储蓄率是 [[fact:metrics.savings_rate.value]]。结构上非必要占比偏高，先把固定储蓄留出来，再看剩下的怎么分配。
