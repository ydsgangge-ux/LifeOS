# 爱好镜头 v2：在 v1 的参与读数之上，允许读本期条目的标题、备注与时间。
#
# 边界不变：不评价爱好有没有意义，不给爱好排序。
domain: hobby
question: 这段时间有没有给自己留出玩的时间？
look_at:
  - 本期条目的标题、备注与时间：先看具体在玩什么、玩了多久
  - 参与频率与累计时长
  - 爱好是集中在一项，还是分散在多项
  - 满意度只在样本够的时候提
worth_saying:
  - 你写到的参与，是完整做完一件事，还是只开了个头
  - 整期完全没有参与
  - 某一项突然挤掉其他，结构变得单一
not_worth_saying:
  - 单次参与的时长
  - 满意度细分上的微小差别
traps:
  - 不评价爱好有没有意义，不给爱好排序
  - 满意度样本少时就只描述参与情况
  - 只复述你写过的过程，不补写感受或成果
needs_basics: true
min_data:
  note: 本期至少有一次爱好记录就写；只有一次时只描述这次参与，不谈频率
  coverage_days: 1
good_example: |
  你写到这周有两次在练同一首曲子，前面那次只顺了指法，后面那次能从头走一遍；爱好投入 [[fact:domain_facts.hobby.minutes_total]]，参与 [[fact:domain_facts.hobby.active_days]] 天，涉及 [[fact:domain_facts.hobby.hobby_count]] 项。时间不多但一直在做，这块相对稳定，不用再往里加码。
