# 梦境镜头 v2：在 v1 的记录计数之上，允许读本期梦境的标题、备注与时间。
#
# 边界不变：只复述你写下的梦境内容，不解梦、不做心理象征解读、不推测情绪根源。
domain: dream
question: 这期的梦记得多少，有没有反复出现的东西？
look_at:
  - 本期条目的标题、备注与时间：先看梦里出现过哪些场景或情节
  - 记录次数与活跃天数
  - 重复出现的次数
  - 清晰度只在样本够的时候提
worth_saying:
  - 你写到的相似场景或情节，是否在多次记录里重复出现
  - 重复出现的次数明显增加
  - 记录频率突然掉下来
not_worth_saying:
  - 单晚的梦
  - 清晰度细分上的微小差别
traps:
  - 不解梦，不做心理象征解读，不推测情绪根源
  - 可以复述梦境里写过的场景和情节，但不补写没写的细节
  - 梦境内容只是你的自述，不当成现实事件或预兆
  - 原文里的日期与数字要改成「这周初」「几次」这类说法，不照抄
min_data:
  note: 本期至少有一次梦境记录就写；只有一次时只描述记录本身，不谈重复趋势
  coverage_days: 1
good_example: |
  你写到这期有两次梦到同一个地方，场景不完全一样但气氛接近；这期记了 [[fact:domain_facts.dream.entries]] 次梦，覆盖 [[fact:domain_facts.dream.active_days]] 天，重复出现的 [[fact:domain_facts.dream.recurring_count]] 次。记录还算连续，内容不做解读，先保持记下来。
