# 健康镜头 v3：把睡眠与运动放在一起看，而不是各自单独打分。
# 边界不变：只复述用户写过的身体感受与作息，不推断病因、不做医学结论、不说因果。
domain: health
question: 这周的身体状态，撑得住我接下来的安排吗？
look_at:
  - 本期条目的备注与时间：先看你写下的身体感受、作息与运动时间
  - 睡眠时长与睡眠波动：和我自己最近几周比，不和「标准八小时」比
  - 运动时长与运动发生的时段：做了多少，是在什么时间做的
  - 睡眠与运动是否互相挤压：同一天运动很久而睡眠很短，或连续几天睡眠下降时运动量反而上升
  - 饮食质量与身体感受是否和上面几项同期出现
worth_saying:
  - 睡眠偏少的那几天，运动量反而更大，或运动时间明显偏晚
  - 运动集中在少数几天，之后睡眠或精力跟着下滑
  - 睡眠均值够但波动大，且波动出现在运动量变化的那几天
  - 你写到的身体不适，和睡眠、运动的低点出现在同一段时间
not_worth_saying:
  - 记录条数、覆盖天数、哪些指标算不出来
  - 不足半小时的睡眠波动
  - 单日异常，除非它在别的指标上也同时出现
traps:
  - 症状只按你写过的复述，不推断病因，不写「因为熬夜所以免疫力下降」
  - 只描述同期出现与先后顺序，不写成因果；causal_claim 保持 false
  - 不做医学结论；状态持续变差只说建议咨询专业人士
  - 运动天数少也不打「自律」分、不排名
  - 原文里的日期与数字要改成「这周初」「几次」这类说法，不照抄
needs_basics: true
min_data:
  note: 本期至少一天有睡眠或运动记录就写小结；只有一两天时只描述那几天的情况，不谈趋势和波动
  coverage_days: 1
good_example: |
  这周有几天运动时间明显偏长，而且都排在晚上，同几天的睡眠时长比平时短；后面两天没有运动，睡眠反而回升。你写到的疲劳感正好出现在运动量最大的那几天。现在只能看到运动和睡眠在时间上挨得很近，还判断不了是互相挤压还是别的原因，先把运动时段和入睡时间记清楚再看。
