# 健康镜头 v2：在 v1 的睡眠/运动读数之上，允许读本期条目的备注与时间。
#
# 边界不变：只复述用户写过的身体感受与作息，不推断病因、不做医学结论。
domain: health
question: 这周的身体状态，撑得住我接下来的安排吗？
look_at:
  - 本期条目的备注与时间：先看你写下的身体感受和作息，再看指标
  - 睡眠时长：和我自己最近几周的平均比，不和「标准八小时」比
  - 睡眠波动：每晚差距大不大，比单日均值更能说明状态稳不稳
  - 运动：有没有做，比做了多少更重要
  - 饮食质量：单独看，不和睡眠拼成「健康总评」
worth_saying:
  - 你写到的身体不适，和睡眠、运动的低点是否出现在同一段时间
  - 睡眠和上一期相比变化明显，尤其是往少的方向走
  - 运动只集中在少数几天，或者一天都没动
  - 睡眠均值够但波动大
not_worth_saying:
  - 不足半小时的睡眠波动
  - 单日异常，除非它在别的指标上也同时出现
traps:
  - 症状只按你写过的复述，不推断病因，不写「因为熬夜所以免疫力下降」
  - 不做医学结论；状态持续变差只说建议咨询专业人士
  - 运动天数少也不打「自律」分、不排名
  - 原文里的日期与数字要改成「这周初」「几次」这类说法，不照抄
needs_basics: true
min_data:
  note: 本期至少一天有睡眠记录就写小结；只有一两天时只描述发生了什么，不谈趋势和波动
  coverage_days: 1
good_example: |
  你提到这周有几天睡得晚、白天精神不太够；睡眠平均 [[fact:metrics.health.sleep.mean_hours.value]]，每晚之间的波动约 [[fact:metrics.health.sleep.std.value]]，运动做了 [[fact:metrics.health.exercise.days.value]] 天。这周身体状态偏紧，先不加新任务，把入睡时间稳定住再谈别的。
