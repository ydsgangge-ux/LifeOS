# 收入领域镜头：只谈记录与相对变化，绝对金额永不出站。
domain: income
question: 这期的收入记录，和上期比是变多还是变少了？
look_at:
  - 收入记录条数与覆盖天数：先确认这期到底记了几笔
  - 与上期相比的记录条数：条数变化是记录习惯变了，还是收入来源变了
  - 与上期相比的变化比例：只有上期也有记录时才算得出来
worth_saying:
  - 这期完全没有收入记录，或记录条数比上期明显减少
  - 变化比例的方向和支出、储蓄率的方向放在一起看
not_worth_saying:
  - 只凭一笔记录就说收入涨了或跌了
  - 评价收入高低、够不够花（金额不在事实包里）
  - 把条数变化直接说成收入金额变化
traps:
  - 事实包里没有收入金额，任何具体数目都写不出来
  - 一次大额收入会让比例失真，条数又少时不要下结论
  - 收入只出现一次是常态（多数人按月记），不能当成「记录断了」
min_data:
  note: 本期至少有一条收入记录就写；只有一条时只描述这笔记录，不谈趋势
  coverage_days: 1
good_example: |
  这期记了 [[fact:domain_facts.income.entries]] 条收入，覆盖 [[fact:domain_facts.income.active_days]] 天；上期是 [[fact:domain_facts.income.prev_entries]] 条。记录不多，收入本身是否变化还看不出来，先把这个习惯保持住。
