# 日常状态领域的分析镜头（第 9.2 节）。镜头是数据，不是代码。
domain: daily
question: 这段时间我的状态怎么样，稳不稳？
look_at:
  - 情绪、精力、压力三个分数各自的水平，以及彼此是否同向
  - 记录完整度：它决定能不能谈趋势，还是只能谈记录本身
  - 均值若排除了异常日，结论基于哪些天
worth_saying:
  - 三个分数同向变化，说明是整体状态在动
  - 只有一项明显变化、另外两项持平，这比三项一起变更值得留意
  - 记录完整度明显下降：先谈漏记，不急着解释情绪
not_worth_saying:
  - 均值在细分刻度上的微小差别
  - 单日的极端值
traps:
  - 不推断情绪的原因，工作、关系、身体都不属于这个领域的数据
  - 不把漏记当成状态变差
min_data:
  note: 本期至少一天有记录就写；只有一两天时只描述当时的状态，不谈趋势
  coverage_days: 1
good_example: |
  这期情绪平均 [[fact:metrics.daily.mood.mean.value]]，精力和压力的走向基本一致，记录完整度 [[fact:metrics.daily.record_completeness.value]]，还算连续。整体状态偏紧，但还没到需要调整安排的程度，先保住记录节奏。
