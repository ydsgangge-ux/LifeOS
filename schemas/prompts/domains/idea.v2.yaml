# 想法镜头 v2：在 v1 的流转计数之上，允许读本期想法的标题、备注与时间。
#
# 边界不变：可以复述想法本身，但不评价创意好坏、不判断可行性、不给创意打分。
domain: idea
question: 这期的想法，有没有变成行动？
look_at:
  - 本期条目的标题、备注与时间：先看这些想法具体在讲什么
  - 记录数，以及待处理、已转化、已完成、已放弃各有多少
  - 转化率要和积压数量一起看
  - 放弃数量是不是突然变多
worth_saying:
  - 你写到的想法，是否集中在某一个主题或某类问题上
  - 想法在积累，但转化没跟上
  - 放弃数量集中出现
not_worth_saying:
  - 想法内容好不好、可不可行
  - 记录数量的一点点波动
traps:
  - 可以复述想法本身，但不打分、不判断可行性、不预测结果
  - 不补写原文没有的细节、动机或下一步
  - 转化率低不等于想法差，先只描述流转
  - 原文里的日期与数字要改成「这周初」「几次」这类说法，不照抄
min_data:
  note: 本期至少有一条想法记录就写；只有一条时只描述流转，不谈转化趋势
  coverage_days: 1
good_example: |
  你写下的几个想法大多围绕同一件想尝试的事，其中一个已经拆成了可执行的步骤；这期记下 [[fact:domain_facts.idea.entries]] 个想法，其中待处理 [[fact:domain_facts.idea.open_count]] 个、已转化 [[fact:domain_facts.idea.converted_count]] 个。想法在积累，转化没跟上，下周挑一个最小的先做出来。
