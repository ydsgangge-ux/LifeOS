# 资源台账镜头 v2：在 v1 的事件读数之上，允许读本期条目的标题、备注与时间。
#
# 边界不变：台账只登记存量资源，出站没有金额，也不做估价。
domain: resource
question: 我手头的存量资源在往哪个方向走？
look_at:
  - 本期条目的标题、备注与时间：先看具体是哪种资源、发生了什么变动
  - 增加事件和减少事件各有多少，方向比数量重要
  - 活跃天数：说明多久维护一次台账
  - 正向与负向账户各有多少，这是结构信息
worth_saying:
  - 你写到的变动是否集中在同一类资源上
  - 减少事件明显多于增加
  - 整段时间几乎没有变动，活跃天数很低
not_worth_saying:
  - 单个账户的一次变动
  - 把数量变化说成价值变化
traps:
  - 事实包里没有金额，不换算、不估价
  - 原文写了金额或余额时只说「一笔变动」，不写具体数目
  - 不评价某项资源值不值得留
min_data:
  note: 本期至少有一条台账记录就写；只有一条时只描述这次变动，不谈方向
  coverage_days: 1
good_example: |
  你写到这期主要是给一笔长期资源续了期，另外清掉了一直没用的一项；台账有 [[fact:domain_facts.resource.entries]] 条变动，活跃 [[fact:domain_facts.resource.active_days]] 天，增加和减少大致相抵。资源总量没有明显变化，但维护频率偏低，下期挑一项最久没管的更新一下就行。
