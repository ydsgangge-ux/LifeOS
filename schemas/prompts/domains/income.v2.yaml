# 收入镜头 v2：在 v1 的条数/相对变化读数之上，允许读本期条目的标题、备注与时间。
#
# 绝对金额仍不出站；原文写了金额也要改写成模糊说法。
domain: income
question: 这期的收入记录，和上期比是变多还是变少了？
look_at:
  - 本期条目的标题、备注与时间：先看收入来自哪些事情
  - 收入记录条数与覆盖天数：先确认这期到底记了几笔
  - 与上期相比的记录条数：条数变化是记录习惯变了，还是收入来源变了
  - 与上期相比的变化比例：只有上期也有记录时才算得出来
worth_saying:
  - 你写到的来源，是否比上期多了或少了某一类
  - 这期完全没有收入记录，或记录条数比上期明显减少
  - 变化比例的方向和支出、储蓄率的方向放在一起看
not_worth_saying:
  - 只凭一笔记录就说收入涨了或跌了
  - 评价收入高低、够不够花（金额不在事实包里）
  - 把条数变化直接说成收入金额变化
traps:
  - 事实包里没有收入金额，任何具体数目都写不出来
  - 原文写了金额时只说「一笔收入」，不写具体数目
  - 来源用「工资」「兼职」这类说法，不复述具体单位名称
  - 一次大额收入会让比例失真，条数又少时不要下结论
  - 收入只出现一次是常态（多数人按月记），不能当成「记录断了」
min_data:
  note: 本期至少有一条收入记录就写；只有一条时只描述这笔记录，不谈趋势
  coverage_days: 1
good_example: |
  你写到这期除了固定工资，还接了一次零散活；这期记了 [[fact:domain_facts.income.entries]] 条收入，覆盖 [[fact:domain_facts.income.active_days]] 天，上期是 [[fact:domain_facts.income.prev_entries]] 条。记录不多，收入本身是否变化还看不出来，先把这个习惯保持住。
