# 日常状态领域镜头 v3：从「记录完整度」转向「状态本身的变化」。
# 覆盖天数只用来判断能不能谈趋势，不作为值得说的结论。
domain: daily
question: 这段时间我的状态怎么样，稳不稳？
look_at:
  - 本期记录里情绪、精力、压力的具体来源与变化（从备注与详情读，不做心理归因）
  - 三项是否同向，哪一项先动、哪一项最后恢复
  - 有没有连续几天都偏低，或某天明显偏离自己的常态
worth_saying:
  - 三个分数同向变化，说明是整体状态在动
  - 只有一项明显变化、另外两项持平，这比三项一起变更值得留意
  - 某几天状态明显下滑时，记录里同时出现了什么（加班、熬夜、生病等）
not_worth_saying:
  - 记录条数、覆盖天数、漏记了多少
  - 均值在细分刻度上的微小差别
  - 单日的极端值
traps:
  - 不推断情绪的原因，工作、关系、身体都不属于这个领域的数据
  - 不把漏记当成状态变差
min_data:
  note: 本期至少一天有记录就写；只有一两天时只描述当时的状态，不谈趋势
  coverage_days: 1
good_example: |
  这周前段精力偏低，情绪也跟着往下走，后半周两项一起回升；压力分数一直偏高，但和前两项不同步。记录里提到的几次熬夜都出现在精力最低的那几天。整体是阶段性紧张，还看不出长期趋势。
