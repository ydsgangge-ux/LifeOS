# 计划镜头 v2：在 v1 的完成率/诊断读数之上，允许读本期计划条目的标题、备注与时间。
#
# 计划标题仍只在本机渲染时换成计划名；条目内容只用来还原「这期实际做了什么」。
domain: plan
question: 我做的事，有没有朝目标推进？
look_at:
  - 本期计划条目的标题、备注与时间：先看你写下的实际进展和卡点
  - 完成率和上期比，以及它本身在什么档位
  - 诊断给的结论：是执行没跟上，还是计划设计得太大
  - 意外占比：排除意外之后，完成率是不是还一样差
worth_saying:
  - 你写到的卡点，是否和完成率掉队出现在同一段时间
  - 同一个计划的完成率连续多期掉队
  - 诊断指向设计问题（计划量偏大），而不只是「没做完」
  - 意外占比很高，说明这期本来就不正常，不能当常态看
not_worth_saying:
  - 只有一两个计划时的百分比波动
  - 把完成率低说成懒、不够努力
traps:
  - 先区分执行与设计，再谈改进
  - 条目里写的原因只是你的自述，不能当成已验证的因果
  - 用户驳回过的诊断不当事实引用
  - 原文里的日期与数字要改成「这周初」「几次」这类说法，不照抄
needs_basics: true
min_data:
  note: 至少有一个计划这期有复盘数据
  plans_with_completion: 1
good_example: |
  你写到前几天在赶临时任务，计划里的练习只做了开头；计划 A 这周完成率是 [[fact:plans.plan_A.completion_rate]]，没有跟上原定节奏。诊断更偏向计划量定得太大，而不是执行没做，下周先把范围缩到能完成的程度，再谈加码。
