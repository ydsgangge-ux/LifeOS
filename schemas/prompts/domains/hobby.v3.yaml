# 爱好领域镜头 v3：读具体做了什么，而不是只看参与次数。
domain: hobby
question: 这段时间有没有给自己留出玩的时间？
look_at:
  - 本期具体在玩什么、玩了多久、做成了什么（从标题、备注与详情读）
  - 爱好是集中在一项，还是分散在多项；有没有哪一项挤掉了其他
  - 满意度只在有记录时提，且不拿单次感受当长期结论
worth_saying:
  - 整期完全没有参与
  - 某一项突然挤掉其他，结构变得单一
  - 同一种爱好的投入方式变了（例如从自己动手变成只做规划）
not_worth_saying:
  - 参与次数与累计时长本身
  - 单次参与的时长
  - 满意度细分上的微小差别
traps:
  - 不评价爱好有没有意义，不给爱好排序
  - 满意度样本少时就只描述参与情况
min_data:
  note: 本期至少有一次爱好记录就写；只有一次时只描述这次参与，不谈频率
  coverage_days: 1
needs_basics: true
good_example: |
  这期的玩的时间几乎都花在写小说工具上，前后改了几轮，还接了智能体；其他爱好没有出现。投入很集中，也更像在做一个项目，而不是单纯放松。要不要留一点不产出的时间，可以下次再看。
