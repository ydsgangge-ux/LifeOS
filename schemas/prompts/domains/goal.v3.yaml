# 目标领域镜头 v3：读目标标题与检查点内容，判断做的事有没有靠近目标。
# 不再用「标题不在事实包」限制内容分析；也不再以检查点条数本身当结论。
domain: goal
question: 这段时间做的事，有没有真的朝目标靠近？
look_at:
  - 本期目标标题与进行中的目标：这段时间在追什么
  - 检查点里写了什么（进展、决定 keep/revise/pause/drop/achieve 及原因）
  - 关联计划的完成情况，以及完成的内容是否与目标同一个方向
worth_saying:
  - 有目标，但整期没有任何检查点：无法判断是否在靠近
  - 检查点集中在 revise 或 pause：目标本身可能需要调整，记录里写了什么原因
  - 关联计划完成了，但目标状态没有更新：推进和记录脱节
  - 做的事与目标方向不一致（例如计划都在做 A，目标写的是 B）
not_worth_saying:
  - 只看计划完成率就说目标在推进
  - 目标数量多就说执行力强或弱
  - 把「计划做完」等同于「目标达成」
traps:
  - 目标没有进度数值，不能说完成了百分之多少，也不能算距离目标还差多少
  - 不评价目标本身值不值得、难不难
  - 不推断为什么暂停或放弃，除非检查点里写明了
min_data:
  note: 只要有目标或本期有检查点就写；两者都没有才跳过
  coverage_days: 0
needs_basics: true
good_example: |
  这期在追的是写歌这条线，但记录里的动作主要在完善工具和接入智能体，只有一次检查点写明了编曲上的取舍。做的事和目标在同一个大方向，但推进的重点明显偏到了工具上；是不是有意的调整，还要看下一次检查点怎么写。
