# 计划领域的分析镜头（第 9.2 节）。镜头是数据，不是代码。
#
# 出站事实里每个计划只有：代号、完成率、意外占比、产出趋势、诊断结论。
# 每个计划的投入时长没有聚合，所以镜头不谈「投入多少分钟」。
domain: plan
question: 我做的事，有没有朝目标推进？
look_at:
  - 完成率和上期比，以及它本身在什么档位
  - 诊断给的结论：是执行没跟上，还是计划设计得太大
  - 意外占比：排除意外之后，完成率是不是还一样差
worth_saying:
  - 同一个计划的完成率连续多期掉队
  - 诊断指向设计问题（计划量偏大），而不只是「没做完」
  - 意外占比很高，说明这期本来就不正常，不能当常态看
not_worth_saying:
  - 只有一两个计划时的百分比波动
  - 把完成率低说成懒、不够努力
traps:
  - 先区分执行与设计，再谈改进
  - 用户驳回过的诊断不当事实引用
needs_basics: true
min_data:
  note: 至少有一个计划这期有复盘数据
  plans_with_completion: 1
good_example: |
  计划 A 这周完成率是 [[fact:plans.plan_A.completion_rate]]，没有跟上原定节奏。诊断更偏向计划量定得太大，而不是执行没做，下周先把范围缩到能完成的程度，再谈加码。
