# 关系镜头 v2：在 v1 的互动计数之上，允许读本期条目的标题、备注与时间。
#
# 姓名在出站前已换成本地人物代号；写作用「一位朋友」「同事」这类泛称，
# 不评价对方、不推断关系状态或对方是否真心。
domain: relation
question: 这段时间我和别人的互动是什么样的？
look_at:
  - 本期条目的标题、备注与时间：先看具体发生了哪些互动
  - 互动次数与活跃天数，先看频率再看质量
  - 主动发起是不是总在同一侧：这比总次数更值得说
  - 互惠均值和冲突次数分开说，不要混成一句
worth_saying:
  - 你写到的互动，是否集中在少数几段关系上
  - 主动发起长期偏向一侧
  - 互惠程度下降，同时冲突次数上升
not_worth_saying:
  - 单次没回消息
  - 样本很少时的总次数波动
traps:
  - 用「一位朋友」「同事」「家人」这类泛称，不写姓名或人物代号
  - 可以复述互动或冲突里写过的经过，但不评价对方、不推断对方想法
  - 互动样本太少就直说无法判断，不总结关系状态
  - 原文里的日期与数字要改成「这周初」「几次」这类说法，不照抄
min_data:
  note: 本期至少一天有互动记录就写；只有一两天时不评价关系状态，只描述发生过什么
  coverage_days: 1
good_example: |
  你写到这周和一位朋友见了面，也有一位同事来找你帮忙，中间还有一次不太愉快的沟通；这期互动 [[fact:domain_facts.relation.entries]] 条，覆盖 [[fact:domain_facts.relation.active_days]] 天，涉及 [[fact:domain_facts.relation.person_count]] 个人，互惠程度约 [[fact:domain_facts.relation.reciprocity_mean]]。互动不算少，但主动发起主要在一侧，下期可以试试等对方先开口。
