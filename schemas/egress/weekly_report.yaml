# 周报出站白名单（第 7.4 节第 2 步）。
#
# 允许清单：不在 allow 里的区块与字段一律留在本地，不做「默认放行」。
# 字段名对应事实包（第 8.7 节）的结构，逐层收窄：区块 → 记录 → 字段。
# 新增字段要先在这里登记，否则它出不去——这是刻意设计，防止顺手加字段导致泄漏。

purpose: weekly_report

allow:
  # 事实包区块（顺序即出站 JSON 的键序）
  # 注：profile 区块含 age_band 与 locale。locale 本身不是敏感字段，但它决定
  # 出站提示词用哪种语言（P6 W5b.4/A6），故随 profile 区块一并放行、不单独收窄。
  facts: [facts_version, period, profile, basics, coverage, metrics, entry_texts, domain_facts_version, domain_facts, domain_summaries, goals, plans, insights, anomalies, data_gaps]

  # 内容层每条记录允许出现的字段；details 是该条记录的全部详情字段
  # （金额原值、身高体重、症状、睡眠质量、学科、产出描述……）。
  entry_text_fields: [at, domain, title, note, tags, details]

  # 分领域 agent 的小结：整合调用只读「领域代号 + 一段总结 + 评价」。
  # 小结由该领域白名单内的事实与 entry_texts 生成：人物已泛称化，但会概括条目内容。
  # v8 起领域层不再写建议与缺口，所以这两类字段也不在白名单里。
  record_fields:
    # 报告内容层：自动带出本期条目的标题、备注与时间戳。
    # 姓名在本地先替换成人物代号；手机号/证件号/银行卡/邮箱/网址仍由网关兜底丢弃。
    entry_texts: [total, included, items]
    domain_summaries: [domain, summary, findings]
    # 长期目标：标题、目标值、why_note 都出站，模型才能把建议落在目标上
    goals:
      - ref
      - title
      - area
      - horizon
      - metric_name
      - metric_unit
      - direction
      - baseline
      - target
      - target_date
      - status
      - why_note
      - plan_count
    # 基础信息：结构化枚举、数值与数量（含 0013 人口属性：性别/年龄/身高体重），
    # 不出职位名（接近自由文本，可能指向身份）。人口属性让建议能落在真实身体与人生阶段。
    basics:
      - gender
      - age
      - height_cm
      - weight_kg
      - industry
      - education_level
      - work_style
      - risk_tolerance
      - family_status
      - dependents
      - constraints

  # 领域摘要：7 个没有指标的定性领域只出「过程统计」。这里逐领域列字段，
  # 未登记的领域与字段一律留在本地；摘要本身不含姓名、标题、正文、条目 id 或日期。
  domain_facts:
    relation:
      - entries
      - active_days
      - person_count
      - kind_counts
      - initiated_counts
      - quality_mean
      - quality_n
      - reciprocity_mean
      - conflict_count
    education:
      - entries
      - active_days
      - minutes_total
      - minutes_mean
      - activity_counts
      - score_mean_ratio
      - score_samples
      - skill_count
    career:
      - entries
      - active_days
      - minutes_total
      - minutes_mean
      - activity_counts
      - impact_mean
      - impact_n
      - opportunity_count
      - skill_count
    hobby:
      - entries
      - active_days
      - minutes_total
      - minutes_mean
      - hobby_count
      - satisfaction_mean
      - satisfaction_n
    idea:
      - entries
      - status_counts
      - open_count
      - converted_count
      - conversion_rate
      - done_count
      - dropped_count
    dream:
      - entries
      - active_days
      - clarity_mean
      - clarity_n
      - recurring_count
      - theme_count
      - theme_tagged_count
    resource:
      - entries
      - active_days
      - account_count
      - kind_counts
      - increase_events
      - decrease_events
      - unchanged_events
      - positive_accounts
      - negative_accounts
    # 收入只出条数与相对变化，绝对金额永不出站
    income:
      - entries
      - active_days
      - prev_entries
      - change_ratio
    # 目标只出状态分布与检查点计数，不出标题、why_note 与进展正文
    goal:
      - goals_total
      - status_counts
      - checkpoints
      - checkpoint_active_days
      - goals_with_checkpoint
      - decision_counts
      - metric_value_count
      - plans_linked
      - plans_done

  # 指标：放聚合与比值，也放金额原值（raw 档由 transform.money 控制）
  metrics:
    - daily.mood.mean
    - daily.energy.mean
    - daily.stress.mean
    - daily.day_rating.mean
    - daily.record_completeness
    - health.sleep.mean_hours
    - health.sleep.std
    - health.sleep.short_days
    - health.sleep_quality.mean
    - health.exercise.minutes_total
    - health.exercise.days
    - health.diet_quality.mean
    - health.height.mean
    - health.weight.mean
    - health.symptom_days
    - goal.confidence.mean
    - income.total
    - expense.total
    - expense.nonessential_ratio
    - savings_rate
    - plan.completion_rate
    - anomaly.count

  # 指标记录里可以出现的字段（key/value_kind 用于本地渲染回代号与单位）
  metric_fields:
    - key
    - description
    - unit
    - value_kind
    - value
    - prev_value
    - delta
    - n
    - status
    - reason
    - excluded_anomalies
    - value_without_exclusion
    - lineage

  plan_fields: [ref, completion_rate, anomaly_share, output_trend, diagnosis]
  plan_diagnosis_fields: [verdict, reasons, thresholds_ref, user_rejected]

  insight_fields:
    - id
    - pair
    - lag_days
    - rho
    - n
    - n_eff
    - ci
    - p_value
    - level
    - causal_claim
    - missing_maybe_not_random
    - missing_mean_diff
    - anomaly_day_effect
    - common_factors
    - uncontrolled_factors
    - verification
    - thresholds_ref
    - lineage

  anomaly_fields: [count, impact_sum]

  # 自由文本默认不出站；api_extended 下报告会带 entry_texts（本期条目的标题/备注），
  # 原始 entry.title / entry.note 仍不作为字段出站。confirmed_texts 是页面级预览的补充通道。
  free_text: true

transform:
  money: raw
  date: week_index
  person: code

# 激进档：报告不再做逐字段标识扫描，金额也不再换算成收入占比。
# 依据是用户显式选择「把本期全部内容交给厂家 API 分析」；想收回改成 false 即可。
raw: true

# 永不外发的对象（写在这里是为了让审计可读）。
# raw 档下详情字段会随 entry_texts.details 出站，但人物姓名仍先换成本地代号。
deny_always:
  - person.display_name
  - person.note
  - attachment.*
