# 月报出站白名单（第 7.4 节第 2 步）：与周报同构，但不含自由文本。
#
# 月报周期更长、样本更多，聚合本身已足够说明趋势；api_extended 下会带上
# 本期条目的标题/备注（entry_texts），其余自由文本仍不出站，出站面保持收窄。

purpose: monthly_report

allow:
  # profile 区块含 age_band 与 locale；locale 决定出站提示词语言（P6 W5b.4/A6），
  # 随 profile 区块放行（locale 非敏感字段）。
  facts: [facts_version, period, profile, basics, coverage, metrics, entry_texts, domain_facts_version, domain_facts, domain_summaries, goals, plans, insights, anomalies, data_gaps, history, sources]

  # 内容层每条记录允许出现的字段；details 是该条记录的全部详情字段
  entry_text_fields: [at, domain, title, note, tags, details]

  # 分领域 agent 的小结：整合调用只读「领域代号 + 一段小结」。
  # 跨月对比（近 6 个月）：只发逐月聚合数字。income 不进 history，
  # 金额只发支出总额；未登记的字段留在本地。
  record_fields:
    # 报告内容层：本期条目的标题、备注与时间戳（api_extended 才带上）
    entry_texts: [total, included, items]
    domain_summaries: [domain, summary, findings, advice]
    # 分层摘要：下层报告（周报）的引用代号、总结与评价；只有这三样出站
    sources: [ref, summary, evaluation]
    # 长期目标：标题、目标值、why_note 都出站，模型才能把建议落在目标上
    goals:
      - ref
      - title
      - area
      - horizon
      - metric_name
      - metric_unit
      - direction
      - baseline
      - target
      - target_date
      - status
      - why_note
      - plan_count
    # 基础信息只出结构化枚举与数量，不出职位名
    basics:
      - industry
      - education_level
      - work_style
      - risk_tolerance
      - family_status
      - dependents
      - constraints
    history:
      - month
      - record_completeness
      - expense_total
      - mood_mean
      - exercise_minutes
      - relation_entries
      - career_minutes_total
      - education_minutes_total
      - hobby_minutes_total

  # 领域摘要：与周报同构，只出过程统计；逐领域登记字段，未登记的一律留在本地。
  domain_facts:
    relation:
      - entries
      - active_days
      - person_count
      - kind_counts
      - initiated_counts
      - quality_mean
      - quality_n
      - reciprocity_mean
      - conflict_count
    education:
      - entries
      - active_days
      - minutes_total
      - minutes_mean
      - activity_counts
      - score_mean_ratio
      - score_samples
      - skill_count
    career:
      - entries
      - active_days
      - minutes_total
      - minutes_mean
      - activity_counts
      - impact_mean
      - impact_n
      - opportunity_count
      - skill_count
    hobby:
      - entries
      - active_days
      - minutes_total
      - minutes_mean
      - hobby_count
      - satisfaction_mean
      - satisfaction_n
    idea:
      - entries
      - status_counts
      - open_count
      - converted_count
      - conversion_rate
      - done_count
      - dropped_count
    dream:
      - entries
      - active_days
      - clarity_mean
      - clarity_n
      - recurring_count
      - theme_count
      - theme_tagged_count
    resource:
      - entries
      - active_days
      - account_count
      - kind_counts
      - increase_events
      - decrease_events
      - unchanged_events
      - positive_accounts
      - negative_accounts
    # 收入只出条数与相对变化，绝对金额永不出站
    income:
      - entries
      - active_days
      - prev_entries
      - change_ratio
    # 目标只出状态分布与检查点计数，不出标题、why_note 与进展正文
    goal:
      - goals_total
      - status_counts
      - checkpoints
      - checkpoint_active_days
      - goals_with_checkpoint
      - decision_counts
      - metric_value_count
      - plans_linked
      - plans_done

  metrics:
    - daily.mood.mean
    - daily.energy.mean
    - daily.stress.mean
    - daily.day_rating.mean
    - daily.record_completeness
    - health.sleep.mean_hours
    - health.sleep.std
    - health.sleep.short_days
    - health.sleep_quality.mean
    - health.exercise.minutes_total
    - health.exercise.days
    - health.diet_quality.mean
    - health.height.mean
    - health.weight.mean
    - health.symptom_days
    - goal.confidence.mean
    - income.total
    - expense.total
    - expense.nonessential_ratio
    - savings_rate
    - plan.completion_rate
    - anomaly.count

  metric_fields:
    - key
    - description
    - unit
    - value_kind
    - value
    - prev_value
    - delta
    - n
    - status
    - reason
    - excluded_anomalies
    - value_without_exclusion
    - lineage

  plan_fields: [ref, completion_rate, anomaly_share, output_trend, diagnosis]
  plan_diagnosis_fields: [verdict, reasons, thresholds_ref, user_rejected]

  insight_fields:
    - id
    - pair
    - lag_days
    - rho
    - n
    - n_eff
    - ci
    - p_value
    - level
    - causal_claim
    - missing_maybe_not_random
    - missing_mean_diff
    - anomaly_day_effect
    - common_factors
    - uncontrolled_factors
    - verification
    - thresholds_ref
    - lineage

  anomaly_fields: [count, impact_sum]

  free_text: false

transform:
  money: raw
  date: week_index
  person: code

# 激进档：报告不再做逐字段标识扫描，金额也不再换算成收入占比。
raw: true

# 永不外发的对象（写在这里是为了让审计可读）。
deny_always:
  - person.display_name
  - person.note
  - attachment.*
